services:
  # ─── Base de données MySQL ─────────────────────────────────
  db:
    image: mysql:8.0
    container_name: benin_tourisme_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: benin_tourisme
      MYSQL_USER: benin_user
      MYSQL_PASSWORD: benin_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - benin_network
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── phpMyAdmin ────────────────────────────────────────────
  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   container_name: benin_tourisme_pma
  #   restart: unless-stopped
  #   environment:
  #     PMA_HOST: db
  #     PMA_PORT: 3306
  #     MYSQL_ROOT_PASSWORD: root
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - db
  #   networks:
  #     - benin_network

  # ─── Application Laravel (Apache) ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benin_tourisme_app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:80" # Apache écoute sur 80, on expose sur 8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - benin_network
    volumes:
      - .:/var/www
      # vendor isolé dans un volume nommé : le bind mount ci-dessus écrase
      # sinon /var/www/vendor par celui (absent) du dépôt cloné côté hôte,
      # rendant inutile le `composer install` fait au build de l'image.
      - vendor_data:/var/www/vendor
      - ./storage:/var/www/storage
    # Pas de 'command' — l'entrypoint (docker/entrypoint.sh) démarre Apache

  # ─── Frontend (React/Vite, servi par Nginx) ─────────────────
  # Ports/URL de test par défaut ci-dessous - à changer ici si le domaine de
  # test diffère (seule modification prévue avant de remettre la main à
  # l'ops, qui n'a ensuite qu'à lancer `docker compose up -d --build`).
  frontend:
    build:
      context: ../totche-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_KKIAPAY_PUBLIC_KEY: ""
        VITE_KKIAPAY_SANDBOX: "true"
    container_name: totche_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - benin_network

volumes:
  db_data:
  vendor_data:

networks:
  benin_network:
    driver: bridge
